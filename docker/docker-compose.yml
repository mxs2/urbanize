name: urbanize

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # Sobrescreve o .env: dentro do container o Redis é um serviço da rede do
      # compose e a API precisa escutar em todas as interfaces.
      REDIS_URL: redis://redis:6379
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
    ports:
      # Com o proxy TLS (profile `tls`) use BACKEND_BIND=127.0.0.1: a API só fica
      # acessível pelo HTTPS do proxy, nunca direto por HTTP.
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-4000}:4000"
    volumes:
      # Código montado do host: editar um arquivo recarrega a API (tsx watch).
      - ../backend:/app
      # Dependências e client do Prisma ficam no volume, compilados para o container.
      - backend_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # RS08: proxy reverso com TLS na frente da API. Não sobe por padrão (o ambiente de
  # desenvolvimento usa HTTP em localhost/rede local); ative com `--profile tls`.
  # Com API_DOMAIN (DNS apontando para este host, portas 80/443 abertas) o Caddy obtém e
  # renova o certificado Let's Encrypt sozinho. Sem ele, usa `localhost` com CA interna.
  proxy:
    image: caddy:2.8.4-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      API_DOMAIN: "${API_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chave da conta ACME: sem o volume, cada recriação pede um novo.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  mobile:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mobile
    restart: unless-stopped
    env_file:
      - ../mobile/.env
    environment:
      # IP do host: o bundle roda no navegador/celular, então a URL da API e a do
      # Metro precisam ser alcançáveis de fora do container.
      EXPO_PUBLIC_API_URL: "${EXPO_PUBLIC_API_URL:-http://${HOST_LAN_IP:-127.0.0.1}:${BACKEND_PORT:-4000}/api}"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${HOST_LAN_IP:-127.0.0.1}"
    # TTY para o Expo desenhar o QR code do Expo Go no log e aceitar as teclas
    # do menu interativo (`docker compose attach mobile`).
    tty: true
    stdin_open: true
    ports:
      - "${METRO_PORT:-8081}:8081"
    volumes:
      - ../mobile:/app
      - mobile_node_modules:/app/node_modules
      # Binário do React Native DevTools baixado sob demanda; o cache evita
      # rebaixá-lo a cada recriação do container.
      - mobile_dotslash_cache:/root/.cache/dotslash
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_node_modules:
  mobile_node_modules:
  mobile_dotslash_cache:
  caddy_data:
  caddy_config:
